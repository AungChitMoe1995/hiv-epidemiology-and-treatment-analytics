name: Snapshot integrity and data audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify published artifact fingerprints
        run: python src/research_io.py
      - name: Audit data and source consistency
        run: python src/validation/data_audit.py
      - name: Existing regression checks
        run: python -m pytest tests/test_data_pipeline.py -q
